name: Backend verification

on:
  push:
    branches:
      - master
      - "sprint/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Build, tests and Forge lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/domain/package-lock.json
      - name: Install Forge app dependencies
        run: npm ci
      - name: Install domain package dependencies
        run: npm ci --prefix packages/domain
      - name: Install Forge CLI
        run: npm install --global @forge/cli
      - name: Run complete backend verification
        run: npm run verify:backend
