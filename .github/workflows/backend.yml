name: Backend verification

on:
  push:
    branches:
      - master
      - "sprint/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/domain/package-lock.json
            static/hello-world/package-lock.json
      - name: Install Forge app dependencies
        run: npm ci
      - name: Install domain package dependencies
        run: npm ci --prefix packages/domain
      - name: Install Custom UI dependencies
        run: npm ci --legacy-peer-deps --prefix static/hello-world
      - name: Build Custom UI resource
        run: npm run build --prefix static/hello-world
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Build domain package
        run: npm run build:domain
      - name: Run backend tests
        run: npm run test:backend
